<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recuperar contraseña · CarOs</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <div class="auth-shell">
    <section class="card auth-card">
      <a th:href="@{/}"><img th:src="@{/img/logo.jpg}" alt="CarOs" style="height:52px;width:auto;border-radius:8px"/></a>
      <h1>Recuperar contraseña</h1>
      <p class="muted">Te enviamos un enlace a tu correo. Caduca en 30 minutos.</p>
      <p th:if="${ok}" class="flash ok" th:text="${ok}"></p>
      <p th:if="${error}" class="flash err" th:text="${error}"></p>
      <form th:action="@{/recuperar}" method="post" class="grid">
        <label>Correo <input type="email" name="correo" required maxlength="120"/></label>
        <button class="btn" type="submit">Enviar enlace</button>
      </form>
      <a class="accent" th:href="@{/login}">Volver a entrar</a>
    </section>
  </div>
</body>
</html>
