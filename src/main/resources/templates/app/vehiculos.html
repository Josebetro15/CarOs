<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vehículos · CarOs</title>
  <script>(function(){var t=localStorage.getItem('caros-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <div th:replace="~{fragments/nav :: bar}"></div>
  <main class="wrap grid">
    <div class="row" style="justify-content:space-between">
      <h1>Vehículos</h1>
      <a class="btn" th:href="@{/app/vehiculos/inspeccion}">Inspección con zoom</a>
    </div>
    <p th:if="${ok}" class="flash ok" th:text="${ok}"></p>
    <p th:if="${error}" class="flash err" th:text="${error}"></p>
    <section class="card grid" th:if="${staff}">
      <h2>Recepción de unidad</h2>
      <p class="muted">Registra los datos del vehículo y el inventario inicial para evitar reclamos.</p>
      <form th:action="@{/app/vehiculos}" method="post" class="grid cols-2">
        <label>Placa <input name="plate" required minlength="5" maxlength="12" placeholder="ABC-12-34"/></label>
        <label>VIN <input name="vin" required minlength="11" maxlength="17" placeholder="17 caracteres"/></label>
        <label>Marca <input name="brand" required minlength="2" maxlength="40"/></label>
        <label>Modelo <input name="modelName" required maxlength="40"/></label>
        <label>Año <input name="year" type="number" required min="1980" max="2035" value="2022"/></label>
        <label>Kilometraje <input name="km" type="number" required min="0" value="0"/></label>
        <label>Cliente
          <select name="ownerId">
            <option value="">Sin cliente todavía</option>
            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.displayName + ' · ' + c.email}"></option>
          </select>
        </label>
        <label style="grid-column:1/-1">Inventario inicial <textarea name="inventario" maxlength="500" placeholder="Tapetes, llanta de refacción, radio, golpes visibles..."></textarea></label>
        <button class="btn" type="submit">Registrar unidad</button>
      </form>
    </section>
    <div class="grid cols-2">
      <a class="card" th:each="v : ${vehicles}" th:href="@{/app/vehiculos/{id}(id=${v.id})}">
        <h2 th:text="${v.brand + ' ' + v.model}">auto</h2>
        <p class="mono accent" th:text="${v.plate}">X</p>
        <p class="muted" th:text="${v.year + ' · ' + v.km + ' km · salud ' + v.health}">x</p>
      </a>
    </div>
  </main>
</body>
</html>
