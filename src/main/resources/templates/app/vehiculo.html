<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${v.plate}">Unidad</title>
  <script>(function(){var t=localStorage.getItem('caros-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <div th:replace="~{fragments/nav :: bar}"></div>
  <main class="wrap grid">
    <p th:if="${ok}" class="flash ok" th:text="${ok}"></p>
    <p th:if="${error}" class="flash err" th:text="${error}"></p>
    <div>
      <p class="mono accent" th:text="${v.plate}">X</p>
      <h1 th:text="${v.brand + ' ' + v.model}">auto</h1>
      <p class="muted" th:text="'VIN ' + ${v.vin} + ' · ' + ${v.year} + ' · ' + ${v.km} + ' km · salud ' + ${v.health}">x</p>
      <p th:if="${v.inventarioInicial != null and !v.inventarioInicial.isEmpty()}" th:text="'Inventario de recepción: ' + ${v.inventarioInicial}"></p>
      <a class="accent" th:href="@{/app/vehiculos/inspeccion(id=${v.id})}">Ver imagen con zoom</a>
    </div>
    <section class="card" th:if="${staff}">
      <h2>Publicar avance</h2>
      <form th:action="@{/app/vehiculos/{id}/avance(id=${v.id})}" method="post" enctype="multipart/form-data" class="grid">
        <label>Estado
          <select name="kind">
            <option th:each="k : ${kinds}" th:value="${k[0]}" th:text="${k[1]}">k</option>
          </select>
        </label>
        <label>Mensaje <textarea name="message" required minlength="3" maxlength="2000" placeholder="Ya se encargaron las piezas, o el carro está listo para entrega."></textarea></label>
        <label>Fotos o video (hasta 3) <input type="file" name="files" accept="image/*,video/*" multiple/></label>
        <button class="btn" type="submit">Publicar</button>
      </form>
    </section>
    <section class="card">
      <h2>Historial</h2>
      <div th:each="u : ${updates}" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">
        <p><b th:text="${@etiquetas.de(u.kind)}">kind</b></p>
        <p th:text="${u.message}">msg</p>
        <div class="media" th:each="m : ${u.media}">
          <img th:if="${m.mediaType == 'image'}" th:src="${m.url}" alt="avance"/>
          <video th:if="${m.mediaType == 'video'}" th:src="${m.url}" controls></video>
        </div>
      </div>
      <p th:if="${#lists.isEmpty(updates)}" class="muted">Todavía no hay actualizaciones.</p>
    </section>
    <section class="card">
      <h2>Diagnósticos</h2>
      <div th:each="s : ${signals}" class="row" style="justify-content:space-between;margin-top:8px">
        <span class="mono accent" th:text="${s.code}">P</span>
        <span th:text="${s.description}">d</span>
        <span class="badge" th:text="${@etiquetas.de(s.status)}">abierta</span>
      </div>
    </section>
  </main>
</body>
</html>
