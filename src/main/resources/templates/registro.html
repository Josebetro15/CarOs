<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Crear cuenta · CarOs</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <div class="auth-shell">
    <section class="card auth-card">
      <a th:href="@{/}"><img th:src="@{/img/logo.jpg}" alt="CarOs" style="height:52px;width:auto;border-radius:8px"/></a>
      <h1>Crear cuenta</h1>
      <p class="muted">Elige el rol. Cliente solo confirma su correo. Mecánico y supervisor necesitan un código que se envía a <span th:text="${supervisor}">supervisor</span>.</p>
      <p th:if="${ok}" class="flash ok" th:text="${ok}"></p>
      <p th:if="${error}" class="flash err" th:text="${error}"></p>
      <form th:action="@{/registro}" method="post" class="grid">
        <label>Nombre <input name="nombre" required minlength="2" maxlength="80" placeholder="Tu nombre"/></label>
        <label>Correo <input type="email" name="correo" required maxlength="120" placeholder="tu@correo.com"/></label>
        <label>Contraseña <input type="password" name="password" required minlength="6" maxlength="72"/></label>
        <label>Repite la contraseña <input type="password" name="password2" required minlength="6" maxlength="72"/></label>
        <label>Rol
          <select name="rol" required>
            <option value="CLIENTE">Cliente</option>
            <option value="MECANICO">Mecánico</option>
            <option value="ENCARGADO">Supervisor</option>
          </select>
        </label>
        <button class="btn" type="submit">Enviar códigos</button>
      </form>
      <a class="accent" th:href="@{/login}">Ya tengo cuenta</a>
    </section>
  </div>
</body>
</html>
