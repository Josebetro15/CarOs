spring.application.name=scanot
server.port=${PORT:8080}

# PostgreSQL / pgAdmin 4 — cambia el password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scanot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

scanot.upload-dir=uploads

# Redirect autorizado en Google Cloud: http://localhost:8080/login/oauth2/code/google
caros.google.enabled=true
caros.google.client-id=${CAROS_GOOGLE_CLIENT_ID:}
caros.google.client-secret=${CAROS_GOOGLE_CLIENT_SECRET:}

springdoc.swagger-ui.path=/swagger-ui.html

# Correo real (Gmail). La contraseña de aplicación va en application-local.properties.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jh6681891@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

caros.mail.from=jh6681891@gmail.com
caros.supervisor.email=jh6681891@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:}
caros.public-url=${RENDER_EXTERNAL_URL:http://localhost:8080}

spring.config.import=optional:classpath:application-local.properties

