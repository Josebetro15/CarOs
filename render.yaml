databases:
  - name: caros-db
    databaseName: scanot
    plan: free

services:
  - type: web
    name: caros
    runtime: java
    plan: free
    buildCommand: chmod +x mvnw && ./mvnw -DskipTests package
    startCommand: java -jar target/scanot-1.0.0.jar
    healthCheckPath: /
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DATABASE_URL
        fromDatabase:
          name: caros-db
          property: connectionString
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: CAROS_GOOGLE_CLIENT_ID
        sync: false
      - key: CAROS_GOOGLE_CLIENT_SECRET
        sync: false
